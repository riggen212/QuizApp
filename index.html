<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="script.js"></script>
</head>

<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Navbar</span>
        </div>
    </nav>

    <article class="container">
        <div class="card quiz-card">
            <img src="./assets/img/background.jpg" class="card-img-top">
            <div class="card-body">
                <h5 class="card-title" id="currentQuestion"></h5>

                <div class="card mb-2">
                    <div class="card-body" id="answer_1">
                    </div>
                </div>
                <div class="card mb-2">
                    <div class="card-body" id="answer_2">
                    </div>
                </div>
                <div class="card mb-2">
                    <div class="card-body" id="answer_3">
                    </div>
                </div>
                <div class="card mb-2">
                    <div class="card-body" id="answer_4">                      
                    </div>
                </div>

                <div class="question-footer">
                    <span>
                        <b>1</b> von <b id="all-questions">5</b> Fragen
                    </span>
                    <button class="btn btn-primary"> Nächste Frage</button>
                </div>

            </div>
        </div>
    </article>

</body>

</html>
