<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="script.js"></script>
</head>

<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Navbar</span>
        </div>
    </nav>

    <article class="container">


        <div class="card quiz-card">
            <img id="card_img" src="./assets/img/background.jpg" class="card-img-top">

            <div class="progress" >
                <div class="progress-bar" id="progress_bar" role="progressbar" style="width: 0%">25%</div>
            </div>

            <div class="card-body text-center" id="end-screen" style="display: none;">
                <h3>Quiz beendet!</h3>
                <p>
                    Du hast <strong id="right_answer-amount"></strong> Fragen von <strong id="end-screen_all"></strong>
                    richtig beanwortet.
                </p>
                <button class="btn btn-primary" onclick="restartGame()"> Erneut spielen!</button>
            </div>

            <div class="card-body" id="question-body">
                <h5 class="card-title" id="currentQuestion"></h5>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1">
                    </div>
                </div>
                <div class="card quiz-answer-card mb-2" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2">
                    </div>
                </div>
                <div class="card quiz-answer-card mb-2" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3">
                    </div>
                </div>
                <div class="card quiz-answer-card mb-2" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4">
                    </div>
                </div>

                <div class="question-footer">
                    <span>
                        <b id="currentQuestionNumber">1</b> von <b id="all-questions"></b> Fragen
                    </span>
                    <button class="btn btn-primary" disabled id="next" onclick="nextQuestion()"> Nächste Frage</button>
                </div>
            </div>
        </div>
    </article>

</body>

</html>
